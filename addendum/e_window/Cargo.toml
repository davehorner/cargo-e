[package]
edition = "2021"
name = "e_window"
description = "A window tool. Think WinAPI ShowMessageBox; but more than that."
license = "MIT"
version = "0.1.15"
authors = ["David Horner"]
publish = true

[build-dependencies]
chrono = "0.4.41"

[features]
uses_uxn = ["raven-uxn", "raven-varvara"]
uses_e_midi = ["e_midi"]
default = ["uses_uxn", "uses_e_midi"]


[dependencies]
e_window_types = "0.1.0"
e_window_native = "0.1.0"
chrono = "0.4.42"
ctrlc = "3.5.0"
egui = { version = "0.33.0", features = ["persistence", "serde"] }
# epi = "0.17.0"
getargs = "0.5.0"
open = "5.3.2"
serde = { version = "1.0.216", features = ["derive"] }
shell-words = "1.1.0"
snailquote = "0.3.1"
sysinfo = "0.37.2"
which = "8.0.0"
winit = "0.30.11"
tempfile = "3.18.0"
dashmap = "6.1.0"
once_cell = "1.21.3"
rand = "0.9.1"
zerocopy = "0.8.26"
anyhow = "1.0.98"
serde_json = "1.0.141"
reqwest = { version = "0.12.22", features = ["blocking", "json"] }
log = "0.4.27"
egui_tiles = "0.14.0"
env_logger = "0.11.8"
rfd = "0.15.0"
ordered-float = "5.1.0"
unicode-width = "0.2.0"
ratatui = "0.29.0"

e_midi = { version = "0.1.11", optional = true }
raven-uxn = { version = "0.1.0", optional = true }
raven-varvara = { version = "0.1.0", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "processthreadsapi"] }
eframe = { version = "0.33.0", features = ["persistence"] }
# Enabled the `persistence` feature for `eframe` to support `get_value` and `set_value`.
windows = { version = "0.62.2", features = ["Win32"] }
e_grid = "0.2.1"
#e_grid = { path = "e_grid"}

[target.'cfg(unix)'.dependencies]
eframe = { version = "0.33.0", features = ["persistence", "serde", "wayland"] }

[lib]
name = "e_window"
path = "src/lib.rs"
